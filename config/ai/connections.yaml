# Connessioni: COME si raggiunge un fornitore.
# Seme della configurazione: in esercizio si modifica da Impostazioni (docs/architettura.md §4.5).
# Le chiavi non stanno mai qui: solo "env:NOME" (obbligatoria), "env:NOME?" (facoltativa) o "secret:NOME" (chiave nel portachiavi del sistema).
# monthly_cap_usd (facoltativo): valore iniziale del tetto di spesa mensile della connessione (D30); quello che l'utente sceglie quando la collega sta nelle sue impostazioni (D36).
version: 1

connections:
  anthropic:
    label: Anthropic
    adapter: anthropic
    api_key: env:ANTHROPIC_API_KEY
    # base_url: https://gateway.esempio.it/anthropic/v1   # facoltativo: gateway o proxy LLM
    http_proxy: env:HTTPS_PROXY?                          # proxy di rete, se serve
    timeout_s: 300                                        # 8.000 token hanno chiesto 65 s (D89): con un servizio lento 120 s non basterebbero
    max_concurrency: 4
    enabled: true

  openrouter:
    label: OpenRouter
    adapter: openai_compatible        # una chiave, molti modelli
    base_url: https://openrouter.ai/api/v1
    api_key: env:OPENROUTER_API_KEY?
    timeout_s: 120
    max_concurrency: 4
    enabled: false                    # da accendere quando serve

  local:
    label: Modelli sul tuo computer
    adapter: openai_compatible        # Ollama, vLLM, LM Studio, gateway compatibili
    base_url: http://localhost:11434/v1
    api_key: none
    timeout_s: 300
    max_concurrency: 1
    enabled: false

  fal:
    label: fal.ai
    adapter: fal
    api_key: env:FAL_KEY
    http_proxy: env:HTTPS_PROXY?
    delivery: polling                 # in locale sempre polling: fal non consegna webhook a indirizzi locali (D29)
    media_retention: short            # durata minima dei file sul CDN del fornitore
    data_region: us
    timeout_s: 900                    # un video può impiegare minuti
    max_concurrency: 3
    # monthly_cap_usd: 100            # esempio di tetto mensile, scelto dall'utente
    enabled: true

  elevenlabs:
    label: ElevenLabs
    adapter: elevenlabs               # per le voci, più avanti: i loro termini vanno letti prima. La musica non si offre (D79)
    api_key: env:ELEVENLABS_API_KEY?  # in esercizio l'utente la inserisce da "Impostazioni > Connessioni" (D25)
    timeout_s: 300
    max_concurrency: 2
    enabled: false                    # musica ed effetti passano da fal (D78)
