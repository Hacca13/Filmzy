# I servizi che Filmzy non offre perché i loro termini lo espongono a contestazioni (D79). Non stanno nel catalogo.
# Se qualcuno li aggiunge a mano dalle impostazioni avanzate può farlo, ma vede questa scritta: lì al momento
# di pubblicare, e in Connessioni accanto all'interruttore.
#
# `match`: basta una parola che comincia così, senza badare alle maiuscole, in id, nome e id presso il
# fornitore del servizio, o in id, nome, adapter e indirizzo della connessione («suno» trova «sunoapi.org»,
# non «nessuno»). `kinds`: senza, vale per ogni tipo di servizio.
version: 1
restricted_services:
  - kinds: [music]                # le voci no: non stanno sotto questi termini e serviranno in Fase 2
    match: [eleven]
    notice: Filmzy non offre ElevenLabs Music. I suoi termini escludono i film su tutti i piani tranne Enterprise Music e vietano di offrirlo tramite altri programmi. Se lo aggiungi da te, rispettare quei termini è una tua responsabilità.
  - match: [suno]
    notice: Filmzy non offre Suno. I termini di Suno limitano l'uso in base al piano (solo personale su quello gratuito) e vietano di ottenere i brani fuori dai suoi canali. Se lo aggiungi da te, rispettare quei termini è una tua responsabilità.
