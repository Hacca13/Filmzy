# I servizi che Filmzy non permette di aggiungere, per i loro termini (D79). Un errore qui ferma la
# pubblicazione, anche per le voci aggiunte dalle impostazioni avanzate.
#
# `match`: basta una parola che comincia così, senza badare alle maiuscole, in id, nome e id presso il
# fornitore del servizio, o in id, nome, adapter e indirizzo della connessione («suno» ferma «sunoapi.org»,
# non «nessuno»). `kinds`: senza, vale per ogni tipo di servizio.
#
# Caricare un file audio fatto altrove resta possibile: Filmzy non controlla da dove viene (D27).
version: 1
blocked_services:
  - kinds: [music]                # le voci no: non stanno sotto questi termini e serviranno in Fase 2
    match: [eleven]
    reason: I termini di ElevenLabs Music escludono i film su tutti i piani tranne Enterprise Music e vietano di offrirlo tramite altri programmi. Puoi generare il brano sul suo sito, se il tuo piano lo consente, e caricarlo come file audio.
  - match: [suno]
    reason: I termini di Suno vietano di ottenere i brani fuori dai suoi canali, e non abbiamo condizioni che permettano di collegarlo a un altro programma. Puoi generare il brano sul suo sito, se il tuo piano lo consente, e caricarlo come file audio.
