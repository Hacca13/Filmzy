# Ruoli: CHI fa cosa nella troupe, con quali parametri e istruzioni.
# Gli schemi di input e output di ogni ruolo stanno nel codice (packages/contracts/src/roles.ts).
# Nessuna riserva automatica (D36): se un servizio fallisce il lavoro si ferma e decide l'utente.
version: 1

roles:
  moderator:
    label: Moderatore
    kind: llm
    model: claude-haiku
    params: { max_tokens: 500 }
    instructions: moderator@1
    output_strategy: auto
    retries: { invalid_output: 1, technical_error: 2 }

  casting:
    label: Direttore del casting
    kind: llm
    model: claude-sonnet
    params: { max_tokens: 4000 }
    instructions: casting@1
    output_strategy: auto
    retries: { invalid_output: 2, technical_error: 3 }

  screenwriter:
    label: Sceneggiatore
    kind: llm
    model: claude-sonnet
    params: { max_tokens: 8000 }
    instructions: screenwriter@1
    output_strategy: auto
    retries: { invalid_output: 2, technical_error: 3 }

  shot_planner:
    label: Aiuto regista
    kind: llm
    model: claude-sonnet
    params: { max_tokens: 6000 }
    instructions: shot_planner@1
    output_strategy: auto
    retries: { invalid_output: 2, technical_error: 3 }

  cinematographer:
    label: Direttore della fotografia
    kind: llm
    model: claude-sonnet
    params: { max_tokens: 1500 }
    instructions: cinematographer@1           # varianti per famiglia: v1.seedance.md, v1.image_generic.md
    output_strategy: auto
    retries: { invalid_output: 2, technical_error: 3 }

  script_supervisor:
    label: Segretaria di edizione
    kind: llm
    model: claude-haiku
    params: { max_tokens: 3000 }
    instructions: script_supervisor@1
    output_strategy: auto
    retries: { invalid_output: 2, technical_error: 3 }

  character_designer:
    label: Character designer
    kind: image
    model: nano-banana-2
    params: { resolution: "1K", aspect_ratio: "3:4" }
    instructions: character_designer@1        # template del prompt immagine, senza LLM
    retries: { technical_error: 2 }

  set_designer:
    label: Scenografo
    kind: image
    model: nano-banana-2
    params: { resolution: "1K", aspect_ratio: "16:9", variants: 3 }
    instructions: set_designer@1              # template del prompt immagine, senza LLM; il luogo porta già il suo prompt in inglese
    retries: { technical_error: 2 }

  retoucher:
    label: Ritocco
    kind: image
    model: nano-banana-2-edit                 # richiede image_edit: su fal è un punto d'accesso a parte
    params: { resolution: "1K" }
    instructions: retoucher@1
    retries: { technical_error: 2 }

  storyboard_artist:
    label: Storyboard
    kind: image
    model: nano-banana-2-edit                 # riceve le schede dei personaggi e sa modificare un'immagine
    prompt_from: cinematographer
    # Due modi: "storyboard" (varianti da riferimenti) e "end_frame" (ultimo fotogramma, modifica il primo: richiede image_edit, quindi il router lascia solo i modelli che lo dichiarano)
    # Seedream Lite resta nel catalogo come alternativa in «Cambia servizio», ma non sa scegliere le
    # proporzioni (ha nomi suoi per le dimensioni), quindi non è un candidato dello storyboard (T1.7).
    params: { variants: 3, aspect_ratio: "16:9", resolution: "1K" }
    retries: { technical_error: 2 }

  camera_operator:
    label: Operatore di ripresa
    kind: video
    routing:
      policy: balanced                        # cheap | balanced | quality
      candidates: [kling-o3-standard, seedance-2, seedance-2-fast, gemini-omni-flash]
    prompt_from: cinematographer
    # Qui stanno solo i parametri che **tutti** i candidati accettano (§4.6 punto 3). Risoluzione e
    # audio no: Kling non ha la risoluzione e Gemini Omni non ha un interruttore per l'audio, che
    # genera sempre. I prezzi del catalogo sono quelli a 720p, che è il valore di partenza di chi la
    # accetta, e l'audio nativo dei take resta spento nel mix (D24). Un parametro per servizio
    # dentro un ruolo è una decisione aperta (architettura §13).
    params: { aspect_ratio: "16:9" }
    retries: { technical_error: 2 }

  composer:
    label: Compositore
    kind: music
    model: music-elevenlabs
    instructions: composer@1                  # template del prompt audio, senza LLM
    retries: { technical_error: 2 }
    enabled: false                            # si accende in T5.4, quando il fornitore è verificato

  sfx_artist:
    label: Rumorista
    kind: sfx
    instructions: sfx_artist@1
    retries: { technical_error: 2 }
    enabled: false                            # il fornitore degli effetti sonori è da ricercare (T5.4)

  sound_planner:
    label: Sound designer
    kind: llm
    model: claude-sonnet
    params: { max_tokens: 3000 }
    instructions: sound_planner@1
    output_strategy: auto
    retries: { invalid_output: 2, technical_error: 3 }
