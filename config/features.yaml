# Funzioni attive e limiti. Seme: in esercizio si modificano dal pannello admin.
version: 1

features:
  real_people: false     # cast personale: dopo il test sui volti reali e la consulenza legale (D4, D19)
  dialogue: false        # dialoghi parlati: Fase 2
  dubbing: false         # doppiaggio: Fase 3
  music: false           # musica: quando è scelto il fornitore (M5)
  preview_gate: false    # anteprima video economica prima del take finale (idea da valutare)
  keyframes: false       # "Imposta le immagini": primo e ultimo fotogramma scelti dall'utente (D20); si accende in M4
  image_upload: false    # caricare luoghi e oggetti, con controllo delle immagini (D19); opzione dell'MVP
  retouch: false         # ritocco col pennello sulle immagini (D21); opzione dell'MVP

limits:
  max_characters: 2      # personaggi principali per film (MVP); lo applica il backend
